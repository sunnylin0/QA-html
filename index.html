<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QA 回報與修正系統</title>
</head>

<body>
  <div id="app">
    <header>
      <h1>QA 系統</h1>
      <div style="display:flex; align-items:center; gap: 1rem;">
        <div id="user-info" style="font-size: 0.9rem; color: #555;">
          Hi, <span id="current-user-name"
            style="font-weight:bold; color:#2563eb; cursor:pointer; text-decoration:underline;">User</span>
        </div>
        <nav>
          <button id="tab-report" class="active">回報問題</button>
          <button id="tab-list">修正列表</button>
        </nav>
      </div>
    </header>

    <main>
      <!-- Report Section -->
      <section id="section-report" class="active">
        <div class="card">
          <h2>新增問題回報</h2>
          <form id="report-form">
            <div class="row">
              <div class="group">
                <label>模組 (Module)</label>
                <input type="text" name="module" placeholder="例如: 其他管理" required />
              </div>
              <div class="group">
                <label>功能名稱 (Function)</label>
                <input type="text" name="functionName" placeholder="例如: 供應者評鑑" required />
              </div>
            </div>

            <div class="row">
              <div class="group">
                <label>功能代號 (Code)</label>
                <input type="text" name="code" placeholder="例如: P020208" required />
              </div>
              <div class="group">
                <label>連結 (URL)</label>
                <input type="url" name="url" placeholder="http://..." />
              </div>
            </div>

            <div class="row">
              <div class="group">
                <label>回報人員 (Reporter)</label>
                <input type="text" name="reporter" id="reporter-input" placeholder="您的姓名" required />
              </div>
              <div class="group">
                <label>時間 (Time)</label>
                <input type="datetime-local" name="timestamp" id="timestamp-input" required />
              </div>
            </div>

            <div class="group">
              <label>問題描述 (Description)</label>
              <textarea name="description" rows="5" placeholder="請詳細描述測試日期、問題內容..." required></textarea>
            </div>

            <!-- Hidden ID Field for Edit Mode -->
            <input type="hidden" name="id" id="report-id">
            <input type="hidden" name="action" id="report-action" value="create">

            <div class="row" style="gap: 1rem;">
              <button type="submit" class="btn-primary" id="btn-submit-report">送出回報</button>
              <button type="button" class="btn-secondary hidden" id="btn-cancel-edit">取消修改</button>
            </div>
          </form>
        </div>

        <!-- Recent Reports Section -->
        <div class="card" style="margin-top: 2rem;">
          <h2>最近回報 (最後 10 筆)</h2>
          <div class="filter-bar" style="margin-bottom: 1rem;">
            <input type="text" id="recent-search" placeholder="搜尋最近回報..." style="flex:1;">
          </div>
          <div id="recent-list">
            <!-- Recent items injected here -->
          </div>
        </div>
      </section>

      <!-- List Section -->
      <section id="section-list">
        <div class="filter-bar">
          <div id="status-find">
            <input type="text" id="search-input" placeholder="搜尋關鍵字..." />
          </div>
          <select id="status-filter">
            <option value="All">全部狀態</option>
            <option value="New">未解決 (New)</option>
            <option value="Fixed">已修正 (Fixed)</option>
            <option value="Closed">已結案 (Closed)</option>
          </select>
          <div class="view-toggle">
            <button id="btn-view-card" class="active" title="卡片檢視">▤</button>
            <button id="btn-view-list" title="清單檢視">☰</button>
          </div>
          <button id="btn-refresh">重新整理</button>
        </div>
        <div id="loading" class="hidden">載入中...</div>

        <!-- Pagination Controls -->
        <div id="pagination-controls" class="hidden"
          style="margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center;">
          <div class="page-size">
            顯示
            <select id="items-per-page">
              <option value="10">10</option>
              <option value="20">20</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
            筆 / 頁
          </div>
          <div class="page-nav" style="display: flex; gap: 0.5rem; align-items: center;">
            <button id="btn-prev" class="btn-sm">上一頁</button>
            <span id="page-info">Page 1 of 1</span>
            <button id="btn-next" class="btn-sm">下一頁</button>
          </div>
        </div>

        <div id="issue-grid" class="view-card">
          <!-- Cards will be injected here -->
        </div>
      </section>
    </main>
  </div>

  <!-- Fix Modal -->
  <div id="modal-fix" class="modal hidden">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <h3>問題修正</h3>
      <h2 id="modal-issue-info" class="modal-subject"></h2>
      <div id="modal-url-container" style="margin-bottom: 1rem;"></div>
      <form id="fix-form">
        <div class="row">
          <div class="group">
            <label>狀態 (Status)</label>
            <select name="status" id="modal-status">
              <option value="New">New (未解決)</option>
              <option value="Fixed">Fixed (已修正)</option>
              <option value="Closed">Closed (已結案)</option>
            </select>
          </div>
          <div class="group">
            <label>回報時間 (Report Time)</label>
            <input type="text" id="modal-timestamp" disabled style="background:#e5e7eb; cursor:not-allowed;">
          </div>
          <div class="group">
            <label>修正時間 (Fix Time)</label>
            <input type="datetime-local" name="fixTime" id="modal-fixTime">
          </div>
        </div>
        <div class="group">
          <label>修正人員 (Fixer)</label>
          <input type="text" name="fixer" id="modal-fixer" placeholder="工程師姓名" required />
        </div>
        <div class="group">
          <label>修正說明 (Fix Note)</label>
          <textarea name="fixNote" id="modal-fixNote" rows="3" placeholder="請填寫處理方式..."></textarea>
        </div>

        <button type="submit" class="btn-primary">更新狀態</button>
      </form>
    </div>
  </div>

  <!-- Login Modal -->
  <div id="modal-login" class="modal">
    <div class="modal-content" style="max-width: 400px; text-align: center;">
      <h3>歡迎使用 QA 系統</h3>
      <p style="margin-bottom: 1.5rem; color:#666;">請輸入您的姓名以繼續</p>
      <form id="login-form">
        <div class="group">
          <input type="text" id="login-name" placeholder="您的姓名 (例: 王小明)" required style="text-align:center;">
        </div>
        <button type="submit" class="btn-primary">進入系統</button>
      </form>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
